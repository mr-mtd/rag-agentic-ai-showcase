name: Deploy

# Builds the site and publishes it to S3 behind CloudFront.
#
# AWS access uses GitHub OIDC: the job exchanges a short-lived GitHub token for
# temporary credentials of an IAM role, so no AWS keys are stored in GitHub.
# The role's trust policy only accepts tokens from this repo's main branch, and
# its permissions only allow syncing one bucket and invalidating one distribution.
on:
  push:
    branches: [main]
  workflow_dispatch:

# id-token: write lets the job request the OIDC token that AWS verifies.
permissions:
  id-token: write
  contents: read

# Never run two deploys at once; the newest push wins.
concurrency:
  group: deploy-production
  cancel-in-progress: true

# None of these are secrets: they identify resources, they don't grant access.
env:
  AWS_REGION: us-east-2
  AWS_ROLE_ARN: arn:aws:iam::988233322191:role/github-actions-hybrid-rag-frontend-deploy
  S3_BUCKET: hybrid-rag-frontend-988233322191
  CLOUDFRONT_DISTRIBUTION_ID: EY1KGAEUAAYFX

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # VITE_API_BASE_URL stays empty on purpose: the app calls /api on its own
      # origin and CloudFront forwards /api/* to the Lightsail backend, so the
      # browser never makes a cross-origin request and no CORS is needed.
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ''

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Vite fingerprints assets, so they can be cached for a year. index.html is
      # revalidated on every request so a new deploy shows up immediately.
      - name: Upload to S3
        run: |
          aws s3 sync dist/ "s3://$S3_BUCKET/" --delete \
            --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/" "/index.html"

      - name: Summary
        run: echo "Deployed to https://dzo4l1wjzweva.cloudfront.net" >> "$GITHUB_STEP_SUMMARY"
