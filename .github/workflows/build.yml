name: Build

on:
  push:
    branches: [main, feature/dev]
  pull_request:
    branches: [main, feature/dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Repository variable: Settings > Secrets and variables > Actions > Variables.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_ORCHESTRATOR_BASE_URL: ${{ vars.VITE_ORCHESTRATOR_BASE_URL || 'https://d23pzgqslfrw1a.cloudfront.net' }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
